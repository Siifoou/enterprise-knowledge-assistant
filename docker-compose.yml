version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: eka_postgres
    environment:
      POSTGRES_USER: eka_user
      POSTGRES_PASSWORD: eka_password
      POSTGRES_DB: eka_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: